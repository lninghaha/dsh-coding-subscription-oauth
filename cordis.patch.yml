# Optional coding-subscription routes over the base composition.
# Grok Build is the bundle fallback default; a saved agent-default-model
# setting still wins over this value.

- id: agent-default-model
  config:
    provider: grok-build
    model: grok-4.6

- insert:
    # `id` is the stable Cordis plugin identifier; `name` is the bundle/package display name.
    - id: llm-coding-subscription-oauth
      name: dsh-coding-subscription-oauth
