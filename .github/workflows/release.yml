# Tag-triggered release. A maintainer publishes the verified candidate before
# pushing a v* tag; this workflow verifies that registry state before creating
# the GitHub Release.
name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  version-preflight:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Require tag, manifest, and CHANGELOG versions to agree
        run: |
          set -euo pipefail
          expected="${GITHUB_REF_NAME#v}"
          actual="$(node -p 'require("./package.json").version')"
          test "${actual}" = "${expected}"
          grep -q "^## v${expected} " CHANGELOG.md

  verify:
    needs: version-preflight
    runs-on: ubuntu-latest
    env:
      DOCKER_BUILDKIT: "1"
    steps:
      - uses: actions/checkout@v4

      - name: Verify inside an isolated Docker sandbox
        run: |
          docker build \
            --target verify \
            --build-arg NODE_VERSION=22.19.0 \
            --resource memory=3g \
            --resource cpu-quota=200000 \
            --tag test-dsh-coding-oauth:release-verify \
            .
      - name: Verify the registry DSH 0.1.1-rc.2 compatibility profile
        run: |
          docker build \
            --target rc2-compatibility \
            --build-arg NODE_VERSION=22.19.0 \
            --resource memory=3g \
            --resource cpu-quota=200000 \
            --tag test-dsh-coding-oauth:release-rc2 \
            .

  github-release:
    needs: [version-preflight, verify, npm-verify]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Publish or update GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"
          version="${tag#v}"
          notes="$(printf '%s\n' \
            'Install or update:' \
            '' \
            '```bash' \
            "dsh plugin --profile web add dsh-coding-subscription-oauth@${version}" \
            'dsh plugin --profile web update dsh-coding-subscription-oauth' \
            '```' \
            '' \
            'Restart an existing `dsh web` process and hard-refresh the browser.' \
            '' \
            "See CHANGELOG.md for the folded ${tag} notes.")"
          title="dsh-coding-subscription-oauth ${tag}"
          if gh release view "${tag}" >/dev/null 2>&1; then
            printf 'Release %s already exists; updating title and notes.\n' "${tag}"
            gh release edit "${tag}" --title "${title}" --notes "${notes}"
          else
            gh release create "${tag}" --title "${title}" --notes "${notes}"
          fi

  npm-verify:
    needs: version-preflight
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22.19.0"
          registry-url: "https://registry.npmjs.org"

      - name: Verify the maintainer-published npm version and latest dist-tag
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"
          expected="${tag#v}"
          actual="$(npm view "dsh-coding-subscription-oauth@${expected}" version --registry=https://registry.npmjs.org/)"
          latest="$(npm view dsh-coding-subscription-oauth dist-tags.latest --registry=https://registry.npmjs.org/)"
          test "${actual}" = "${expected}"
          test "${latest}" = "${expected}"
