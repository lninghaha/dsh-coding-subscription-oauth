# Tag-triggered release. Do not push a v* tag until a maintainer has approved
# the version. npm Trusted Publishing (OIDC) must be bound for this repository
# so provenance publish can succeed without a long-lived NPM_TOKEN.
name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  id-token: write

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      DOCKER_BUILDKIT: "1"
    steps:
      - uses: actions/checkout@v4

      - name: Verify inside an isolated Docker sandbox
        run: |
          docker build \
            --target verify \
            --build-arg NODE_VERSION=22.19.0 \
            --resource memory=3g \
            --resource cpu-quota=200000 \
            --tag test-dsh-coding-oauth:release-verify \
            .

  github-release:
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Publish or update GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"
          version="${tag#v}"
          notes="$(printf '%s\n' \
            'Install or update:' \
            '' \
            '```bash' \
            "dsh plugin --profile web add dsh-coding-subscription-oauth@${version}" \
            'dsh plugin --profile web update dsh-coding-subscription-oauth' \
            '```' \
            '' \
            'Restart an existing `dsh web` process and hard-refresh the browser.' \
            '' \
            "See CHANGELOG.md for the folded ${tag} notes.")"
          title="dsh-coding-subscription-oauth ${tag}"
          if gh release view "${tag}" >/dev/null 2>&1; then
            printf 'Release %s already exists; updating title and notes.\n' "${tag}"
            gh release edit "${tag}" --title "${title}" --notes "${notes}"
          else
            gh release create "${tag}" --title "${title}" --notes "${notes}"
          fi

  npm-publish:
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22.19.0"
          registry-url: "https://registry.npmjs.org"

      # Requires this GitHub repo to be bound as an npm Trusted Publisher.
      - name: Publish to npm with provenance (skip if version already exists)
        run: |
          set -euo pipefail
          version="$(node -p 'require("./package.json").version')"
          tag="${GITHUB_REF_NAME}"
          expected="${tag#v}"
          if [[ "${version}" != "${expected}" ]]; then
            echo "package.json version (${version}) does not match tag (${expected})" >&2
            exit 1
          fi
          if npm view "dsh-coding-subscription-oauth@${version}" version >/dev/null 2>&1; then
            echo "dsh-coding-subscription-oauth@${version} is already on the registry; skipping publish."
          else
            npm publish --access public --provenance --ignore-scripts
          fi

      - name: Verify published npm version
        run: |
          set -euo pipefail
          expected="$(node -p 'require("./package.json").version')"
          # Registry propagation can lag briefly after a fresh publish.
          for attempt in 1 2 3 4 5 6; do
            actual="$(npm view dsh-coding-subscription-oauth version 2>/dev/null || true)"
            if [[ "${actual}" == "${expected}" ]]; then
              echo "npm latest is ${actual}"
              exit 0
            fi
            echo "waiting for npm latest (got '${actual}', want '${expected}'); attempt ${attempt}"
            sleep 5
          done
          echo "npm latest did not reach ${expected}" >&2
          exit 1
