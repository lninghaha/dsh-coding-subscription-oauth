name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        node: [22.19.0, 24]
    runs-on: ubuntu-latest
    env:
      DOCKER_BUILDKIT: "1"
    steps:
      - uses: actions/checkout@v4
      - name: Verify inside an isolated Docker sandbox
        run: |
          docker build \
            --target verify \
            --build-arg NODE_VERSION=${{ matrix.node }} \
            --resource memory=3g \
            --resource cpu-quota=200000 \
            --tag test-dsh-coding-oauth:verify-${{ matrix.node }} \
            .
      - name: Verify a script-disabled isolated consumer install
        run: |
          docker build \
            --target isolated-install \
            --build-arg NODE_VERSION=${{ matrix.node }} \
            --resource memory=3g \
            --resource cpu-quota=200000 \
            --tag test-dsh-coding-oauth:install-${{ matrix.node }} \
            .
      - name: Verify the registry DSH 0.1.1-rc.2 compatibility profile
        run: |
          docker build \
            --target rc2-compatibility \
            --build-arg NODE_VERSION=${{ matrix.node }} \
            --resource memory=3g \
            --resource cpu-quota=200000 \
            --tag test-dsh-coding-oauth:rc2-${{ matrix.node }} \
            .
